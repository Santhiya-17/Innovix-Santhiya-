<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Result</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-50 to-blue-50">

<div class="max-w-5xl mx-auto p-10">

<h1 class="text-4xl font-bold text-center bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-indigo-600">{{ domain }}</h1>

<div class="mt-8 p-6 bg-white rounded-3xl shadow-lg">
<h2 class="text-2xl font-semibold text-purple-600 mb-4">Roadmap & Skills to Focus</h2>
<div>{% raw %}{{ roadmap | safe }}{% endraw %}</div>
</div>

<div class="mt-8 p-6 bg-white rounded-3xl shadow-lg">
<h2 class="text-2xl font-semibold text-green-600 mb-4">Companies Hiring</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
{% for comp in companies %}
<div class="p-4 rounded-xl bg-gradient-to-r from-pink-400 via-purple-500 to-indigo-500 text-white shadow-md hover:scale-105 transform transition">
<h3 class="font-bold">{{ comp.name }} ({{ comp.type }})</h3>
<p>{{ comp.description }}</p>
</div>
{% endfor %}
</div>
</div>

<div class="mt-10 text-center">
<a href="/career" class="px-6 py-3 rounded-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold hover:scale-105 transform transition">← Analyze Another Career</a>
</div>

</div>

</body>
</html>
