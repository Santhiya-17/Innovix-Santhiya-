<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Guidance</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 font-sans">

<div class="max-w-4xl mx-auto p-6">

    <h2 class="text-4xl font-bold text-blue-900 text-center mb-8">🔹 Career Guidance</h2>
    <p class="text-center text-blue-700 mb-6">Select your interests and skills to get a personalized career roadmap.</p>

    <form action="/analyze" method="POST" class="bg-white shadow-lg rounded-xl p-6 space-y-6">

        <!-- Primary Interest Dropdown -->
        <div>
            <label class="block font-semibold text-blue-800 mb-2">Primary Interest</label>
            <select name="interest" class="w-full border border-blue-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                <option value="">Select Primary Interest</option>
                {% for category, skill_list in skills.items() %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Skills Checkboxes -->
        <div>
            <label class="block font-semibold text-blue-800 mb-2">Your Skills</label>
            <div class="grid md:grid-cols-2 gap-4">
                {% for category, skill_list in skills.items() %}
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                    <h4 class="font-semibold text-blue-700 mb-2">{{ category }}</h4>
                    <div class="space-y-1">
                        {% for skill in skill_list %}
                        <label class="flex items-center space-x-2">
                            <input type="checkbox" name="skills" value="{{ skill | lower }}" class="accent-blue-500">
                            <span class="text-gray-700">{{ skill }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="text-center">
            <button type="submit" class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white px-6 py-3 rounded-full font-semibold hover:scale-105 transform transition">Analyze</button>
        </div>

    </form>
</div>

</body>
</html>
